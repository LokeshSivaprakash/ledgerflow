services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerflow
      DB_USER: ledger
      DB_PASSWORD: ledger
      # Local demo only: lets you mint a token with POST /api/dev/token.
      LEDGER_DEV_TOKEN_ENDPOINT: "true"
    ports:
      - "8080:8080"
